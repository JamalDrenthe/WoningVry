<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEB4"/>
      <stop offset="35%" stop-color="#D4B678"/>
      <stop offset="75%" stop-color="#B9975B"/>
      <stop offset="100%" stop-color="#8C6831"/>
    </linearGradient>
    <linearGradient id="fav-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0"/>
      <stop offset="100%" stop-color="#D4B678"/>
    </linearGradient>
    <filter id="fav-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="14" fill="#0D1B2E"/>
  <rect width="64" height="64" rx="14" stroke="rgba(212, 182, 120, 0.3)" stroke-width="1.5"/>

  <!-- 'WV' Architectural Roof Monogram -->
  <g transform="translate(4.5, 4.5)" filter="url(#fav-shadow)">
    <!-- Roof Eaves -->
    <path d="M4 22 L27 3 L32 7.5 L12.5 24 Z" fill="url(#fav-light)"/>
    <path d="M27 3 L52 22 L45.5 25 L27 9.5 Z" fill="url(#fav-gold)"/>
    <!-- Chimney -->
    <path d="M40 14.5 L40 7.5 L45.5 7.5 L45.5 19 Z" fill="url(#fav-gold)"/>
    
    <!-- Monogram Ribbons -->
    <path d="M3 24.5 L13 52 L19.5 52 L8.5 24.5 Z" fill="url(#fav-gold)"/>
    <path d="M8.5 24.5 L19.5 52 L24.5 38 L14 24.5 Z" fill="url(#fav-light)"/>
    <path d="M14 24.5 L24.5 38 L28 46 L21.5 52 Z" fill="url(#fav-gold)"/>
    <path d="M28 46 L35.5 24.5 L30 24.5 L24.5 38 Z" fill="url(#fav-light)"/>
    <path d="M30 24.5 L35.5 24.5 L43 43 L38 52 Z" fill="url(#fav-gold)"/>
    <path d="M38 52 L44 52 L53 24.5 L47 24.5 Z" fill="url(#fav-light)"/>
  </g>
</svg>
