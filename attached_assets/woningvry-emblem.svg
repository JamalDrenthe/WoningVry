<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="wv-emblem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C88F"/>
      <stop offset="45%" stop-color="#D4B678"/>
      <stop offset="100%" stop-color="#A57D3E"/>
    </linearGradient>
    <filter id="wv-emblem-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep ink luxury background rounded square (optional container) -->
  <rect width="64" height="64" rx="14" fill="#0D1B2E"/>
  <rect width="64" height="64" rx="14" stroke="rgba(212, 182, 120, 0.25)" stroke-width="1"/>

  <g transform="translate(6, 6)" filter="url(#wv-emblem-glow)">
    <!-- Outer Contemporary Gable -->
    <path d="M26 4 L48 22 L48 46 L42 46 L42 24.5 L26 11 L10 24.5 L10 46 L4 46 L4 22 Z" 
          fill="url(#wv-emblem-gold)"/>

