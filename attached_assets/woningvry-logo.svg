<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" fill="none" width="100%" height="100%">
  <defs>
    <!-- Premium Champagne Gold Gradients with multi-stop metallic depth -->
    <linearGradient id="wv-gold-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEB4"/>
      <stop offset="30%" stop-color="#D4B678"/>
      <stop offset="70%" stop-color="#B9975B"/>
      <stop offset="100%" stop-color="#8C6831"/>
    </linearGradient>

    <linearGradient id="wv-gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#D4B678"/>
    </linearGradient>

    <linearGradient id="wv-gold-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#805B22"/>
      <stop offset="100%" stop-color="#C29F5F"/>
    </linearGradient>

    <filter id="wv-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 'WV' Architectural Monogram & Roof Emblem -->
  <g transform="translate(6, 6)" filter="url(#wv-shadow)">
    <!-- Roof Eave Left to Apex -->
    <path d="M4 22 L27 3 L32 7.5 L12.5 24 Z" fill="url(#wv-gold-light)"/>
    
    <!-- Roof Eave Apex to Right -->
    <path d="M27 3 L52 22 L45.5 25 L27 9.5 Z" fill="url(#wv-gold-main)"/>
    
    <!-- Architectural Chimney -->
    <path d="M40 14.5 L40 7.5 L45.5 7.5 L45.5 19 Z" fill="url(#wv-gold-main)"/>
    <path d="M39 7.5 L46.5 7.5 L46.5 6 L39 6 Z" fill="url(#wv-gold-light)"/>

    <!-- Interlocking 'W' & 'V' Architectural Ribbon Structure -->
    <!-- Left W-wing outer stroke -->
    <path d="M3 24.5 L13 53 L19.5 53 L8.5 24.5 Z" fill="url(#wv-gold-dark)"/>
    <path d="M8.5 24.5 L19.5 53 L24.5 39 L14 24.5 Z" fill="url(#wv-gold-main)"/>

    <!-- Center V-interlock (Rising Apex) -->
    <path d="M14 24.5 L24.5 39 L28 47 L21.5 53 Z" fill="url(#wv-gold-light)"/>
    <path d="M28 47 L35.5 24.5 L30 24.5 L24.5 39 Z" fill="url(#wv-gold-main)"/>

    <!-- Right V-wing / Roofline Bridge Ribbon -->
    <path d="M30 24.5 L35.5 24.5 L43 44 L38 53 Z" fill="url(#wv-gold-dark)"/>
    <path d="M38 53 L44 53 L53 24.5 L47 24.5 Z" fill="url(#wv-gold-light)"/>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(74, 8)">
    <!-- WONING (Crisp Architectural White, Optical Kerning) -->
    <text x="0" y="30" 
          font-family="'Fraunces', 'Cinzel', Georgia, serif" 
          font-size="24" 
          font-weight="600" 
          letter-spacing="0.12em" 
          fill="#FFFFFF">WONING</text>

    <!-- VRIJ (Signature Gold Accent, Stylized Italic Serif) -->
    <text x="135" y="30" 
          font-family="'Fraunces', 'Cinzel', Georgia, serif" 
          font-size="24" 
          font-weight="700" 
          font-style="italic"
          letter-spacing="0.14em" 
          fill="url(#wv-gold-main)">VRIJ</text>

    <!-- Subtitle (Clean Modern Proportional Subtitle) -->
    <text x="1" y="46" 
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-size="8.5" 
          font-weight="500" 
          letter-spacing="0.28em" 
          fill="#94A3B8">VRIJ WONEN ZONDER HYPOTHEEK</text>
  </g>
</svg>
