<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Multi-stop luxury metallic gold gradient -->
    <linearGradient id="wv-gold-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5C9"/>
      <stop offset="25%" stop-color="#E1C48F"/>
      <stop offset="60%" stop-color="#C5A362"/>
      <stop offset="100%" stop-color="#936F31"/>
    </linearGradient>

    <!-- Subtle secondary gold sheen for depth -->
    <linearGradient id="wv-gold-sheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B38F4D"/>
      <stop offset="50%" stop-color="#EED8B3"/>
      <stop offset="100%" stop-color="#D4B678"/>
    </linearGradient>

    <!-- Dark navy accent -->
    <linearGradient id="wv-navy-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243C"/>
      <stop offset="100%" stop-color="#0D1B2E"/>
    </linearGradient>

    <!-- Refined drop shadow -->
    <filter id="wv-clean-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ==================== ARCHITECTURAL EMBLEM ==================== -->
  <g transform="translate(4, 5)" filter="url(#wv-clean-shadow)">
    <!-- Sleek Rounded Diamond/Shield Base Backdrop -->
    <rect x="0" y="0" width="54" height="54" rx="12" fill="url(#wv-navy-gradient)"/>
    <rect x="0.5" y="0.5" width="53" height="53" rx="11.5" stroke="url(#wv-gold-metallic)" stroke-width="1" stroke-opacity="0.45"/>

    <!-- Geometric Architectural Gable (Outer roof) -->
    <path d="M27 9 L45 23 L41.5 27 L27 15.5 L12.5 27 L9 23 Z" fill="url(#wv-gold-metallic)"/>

    <!-- Interlocking W-V Geometric Ribbons (Zakelijk & Strak) -->
    <!-- W Left Outer Pillar -->
    <path d="M12.5 26 L18.5 45 L22.5 45 L16.5 26 Z" fill="url(#wv-gold-sheen)"/>
    
    <!-- W Center Apex (Connecting to V) -->
    <path d="M22.5 45 L27 33 L31.5 45 L27.5 45 L27 43.5 L26.5 45 Z" fill="url(#wv-gold-metallic)"/>
    
    <!-- W Right Outer Pillar -->
    <path d="M37.5 26 L31.5 45 L35.5 45 L41.5 26 Z" fill="url(#wv-gold-sheen)"/>

    <!-- Center Key / Freedom Chevron (Vrij) -->
    <path d="M27 21 L34 27 L31.5 29.5 L27 25.5 L22.5 29.5 L20 27 Z" fill="#FFFFFF" opacity="0.95"/>

    <!-- Precision Gold Core Jewel -->
    <polygon points="27,27 30,31 27,35 24,31" fill="url(#wv-gold-metallic)"/>
  </g>

  <!-- ==================== WORDMARK TYPOGRAPHY ==================== -->
  <g transform="translate(70, 7)">
    <!-- Primary Brand Wordmark: WONING (White) + VRIJ (Gold Accent) -->
    <text x="0" y="29" 
          font-family="Fraunces, Cinzel, -apple-system, Georgia, serif" 
          font-size="23" 
          font-weight="700" 
          letter-spacing="0.14em">
      <tspan fill="#FFFFFF">WONING</tspan>
      <tspan fill="url(#wv-gold-metallic)" font-style="italic" dx="2">VRIJ</tspan>
    </text>

    <!-- Subtitle: Corporate Proposition Tagline -->
    <text x="1" y="44" 
          font-family="Inter, -apple-system, system-ui, sans-serif" 
          font-size="7.8" 
          font-weight="600" 
          letter-spacing="0.26em" 
          fill="#94A3B8">
      HUUR &amp; KOOP • ZONDER BANK
    </text>
  </g>
</svg>